name: Deploy to Cloudflare Workers

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Preview' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # main -> production deploy (fo-permian-website.<account>.workers.dev,
      # plus the fopermian.com custom domain once attached).
      - name: Deploy (production)
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # Any other branch -> versioned preview upload with its own URL.
      - name: Upload preview
        if: github.ref != 'refs/heads/main'
        id: preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --tag ${{ github.ref_name }} --message "${{ github.sha }}"

      - name: Preview URL
        if: github.ref != 'refs/heads/main'
        run: |
          echo "### Preview" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.preview.outputs.command-output }}' | grep -Eo 'https://[^ ]+workers\.dev' | head -1 >> "$GITHUB_STEP_SUMMARY" || true
