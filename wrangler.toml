# Cloudflare Workers — static assets deployment for fopermian.com.
# account_id comes from the CLOUDFLARE_ACCOUNT_ID env var in CI (never committed).
name = "fo-permian-website"
compatibility_date = "2026-09-01"

# Preview URLs for non-production uploads (wrangler versions upload).
preview_urls = true
workers_dev = true

[assets]
directory = "./build"
# adapter-static emits 404.html; serve it for unknown paths.
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
